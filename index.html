<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nombres</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-box-align: center;
    -webkit-box-pack: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    background: #111;
    color: #fff;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  #number {
    font-size: 15vw;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  #french {
    font-size: 5vw;
    text-align: center;
    padding: 0 5vw;
    min-height: 1.2em;
    visibility: hidden;
  }
</style>
</head>
<body>
<div id="number">JavaScript required</div>
<div id="french" lang="fr"></div>
<script>
  var el = document.getElementById('number');
  var frEl = document.getElementById('french');

  var UNITS = ['zéro', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf',
    'dix', 'onze', 'douze', 'treize', 'quatorze', 'quinze', 'seize'];
  var TENS = ['', '', 'vingt', 'trente', 'quarante', 'cinquante', 'soixante'];

  function below100(n) {
    if (n < 17) return UNITS[n];
    if (n < 20) return 'dix-' + UNITS[n - 10];
    var t = Math.floor(n / 10), u = n % 10;
    if (t === 7) return u === 1 ? 'soixante et onze' : 'soixante-' + below100(n - 60);
    if (t === 8) return u === 0 ? 'quatre-vingts' : 'quatre-vingt-' + UNITS[u];
    if (t === 9) return 'quatre-vingt-' + below100(n - 80);
    if (u === 0) return TENS[t];
    return TENS[t] + (u === 1 ? ' et un' : '-' + UNITS[u]);
  }

  function below1000(n) {
    var h = Math.floor(n / 100), r = n % 100;
    if (h === 0) return below100(r);
    var head = h === 1 ? 'cent' : UNITS[h] + (r === 0 ? ' cents' : ' cent');
    return r === 0 ? head : head + ' ' + below100(r);
  }

  function toFrench(n) {
    if (n === 1000000) return 'un million';
    var th = Math.floor(n / 1000), r = n % 1000;
    if (th === 0) return below1000(r);
    // "vingt" and "cent" lose their plural s before "mille"
    var head = th === 1 ? 'mille' : below1000(th).replace(/(vingt|cent)s$/, '$1') + ' mille';
    return r === 0 ? head : head + ' ' + below1000(r);
  }

  var current = 0;

  function roll() {
    // Pick one of 6 decades with equal probability: [0,10), [10,100), ..., [100000,1000000]
    var k = Math.floor(Math.random() * 6);
    var lo = k === 0 ? 0 : Math.pow(10, k);
    var hi = Math.pow(10, k + 1) - (k === 5 ? 0 : 1);
    current = lo + Math.floor(Math.random() * (hi - lo + 1));
    // U+202F: narrow no-break space
    el.textContent = String(current).replace(/\B(?=(\d{3})+(?!\d))/g, '\u202F');
    frEl.style.visibility = 'hidden';
  }

  function advance() {
    if (frEl.style.visibility === 'visible') {
      roll();
    } else {
      frEl.textContent = toFrench(current);
      frEl.style.visibility = 'visible';
    }
  }

  var touched = false;

  document.ontouchend = function(event) {
    touched = true;
    if (event.preventDefault) event.preventDefault();
    advance();
    window.setTimeout(function() { touched = false; }, 500);
  };
  document.onclick = function() {
    if (!touched) advance();
  };
  document.onkeydown = advance;
  roll();
</script>
</body>
</html>
